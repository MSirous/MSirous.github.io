<script>
(() => {
  const root = document.getElementById('trust-lab');
  if (!root) return;

  const controls = ['reliable', 'noisy', 'adversarial', 'rounds'];
  const colors = { reliable: '#55e3d3', noisy: '#f4bf5f', adversarial: '#ef6cae' };

  const updateLabels = () => {
    controls.forEach((id) => {
      const input = document.getElementById(id);
      const output = document.getElementById(`${id}-value`);
      output.textContent = id === 'rounds' ? input.value : `${input.value}%`;
    });
  };

  function mulberry32(seed) {
    return function() {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function simulate(probabilities, rounds) {
    const random = mulberry32(20260911 + rounds + Math.round(probabilities.reliable * 100));
    const alpha = 0.065;
    const trust = { reliable: 0.5, noisy: 0.5, adversarial: 0.5 };
    const history = { reliable: [0.5], noisy: [0.5], adversarial: [0.5] };
    const correct = { majority: 0, trusted: 0 };

    for (let round = 0; round < rounds; round++) {
      const outcomes = {};
      Object.keys(trust).forEach((agent) => {
        outcomes[agent] = random() < probabilities[agent] ? 1 : 0;
        trust[agent] += alpha * (outcomes[agent] - trust[agent]);
        history[agent].push(trust[agent]);
      });
      correct.majority += Object.values(outcomes).reduce((sum, value) => sum + value, 0) >= 2 ? 1 : 0;
      const selected = Object.keys(trust).reduce((best, agent) => trust[agent] > trust[best] ? agent : best, 'reliable');
      correct.trusted += outcomes[selected];
    }
    return { history, trust, majority: correct.majority / rounds, trusted: correct.trusted / rounds };
  }

  function draw(result, rounds) {
    const grid = document.getElementById('trust-grid');
    const paths = document.getElementById('trust-paths');
    const width = 760;
    const height = 360;
    const pad = 28;
    grid.innerHTML = '';
    paths.innerHTML = '';

    [0, 0.25, 0.5, 0.75, 1].forEach((value) => {
      const y = pad + (1 - value) * (height - 2 * pad);
      grid.insertAdjacentHTML('beforeend', `<line x1="${pad}" y1="${y}" x2="${width-pad}" y2="${y}" stroke="rgba(151,181,221,.14)"/><text x="${pad+3}" y="${y-6}" fill="#6f829d" font-size="11">${value.toFixed(2)}</text>`);
    });

    Object.entries(result.history).forEach(([agent, values]) => {
      const points = values.map((value, index) => {
        const x = pad + (index / rounds) * (width - 2 * pad);
        const y = pad + (1 - value) * (height - 2 * pad);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      paths.insertAdjacentHTML('beforeend', `<polyline points="${points}" fill="none" stroke="${colors[agent]}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`);
    });

    document.getElementById('trust-summary').innerHTML = `
      <span>Trusted selection accuracy <strong>${(result.trusted * 100).toFixed(1)}%</strong></span>
      <span>Majority accuracy <strong>${(result.majority * 100).toFixed(1)}%</strong></span>
      <span>Final adversarial trust <strong>${result.trust.adversarial.toFixed(2)}</strong></span>`;
  }

  function run() {
    const probabilities = {
      reliable: Number(document.getElementById('reliable').value) / 100,
      noisy: Number(document.getElementById('noisy').value) / 100,
      adversarial: Number(document.getElementById('adversarial').value) / 100
    };
    const rounds = Number(document.getElementById('rounds').value);
    draw(simulate(probabilities, rounds), rounds);
  }

  controls.forEach((id) => document.getElementById(id).addEventListener('input', updateLabels));
  document.getElementById('run-trust').addEventListener('click', run);
  updateLabels();
  run();
})();
</script>
